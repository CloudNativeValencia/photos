  <style>
    :root {
      --bg: #0f0f10;
      --surface: #17181b;
      --surface-2: #1d2025;
      --text: #f5f5f5;
      --muted: #b9bcc3;
      --border: #2c2f36;
      --accent: #7dd3fc;
      --max: 1400px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 20px 12px 32px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px;
    }

    .photo {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .photo img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      object-position: center;
      background: var(--surface-2);
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .photo:hover img,
    .photo:focus-visible img {
      transform: scale(1.02);
      opacity: 0.96;
    }

    .photo:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Lightbox */
    .lb {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
    }

    .lb.open {
      display: flex;
    }

    .lb-img {
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 48px);
      object-fit: contain;
      display: block;
      user-select: none;
    }

    .lb-btn {
      position: fixed;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 120ms ease;
      line-height: 1;
      padding: 8px;
    }

    .lb-btn:hover { opacity: 1; }

    .lb-close {
      top: 16px;
      right: 20px;
      font-size: 2rem;
    }

    .lb-prev {
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
    }

    .lb-next {
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
    }

    @media (max-width: 640px) {
      .lb-img {
        max-width: 100vw;
        max-height: calc(100vh - 80px);
      }
    }
  </style>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo lightbox">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">&#x2039;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">&#x203a;</button>
  </div>

  <script>
    const photos = Array.from(document.querySelectorAll('.photo'));
    const urls = photos.map(a => a.href);
    const alts = photos.map(a => a.querySelector('img').alt);
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    let current = 0;

    function open(index) {
      current = (index + urls.length) % urls.length;
      lbImg.src = urls[current];
      lbImg.alt = alts[current];
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      lb.classList.remove('open');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    photos.forEach((a, i) => {
      a.addEventListener('click', e => { e.preventDefault(); open(i); });
    });

    document.getElementById('lb-close').addEventListener('click', close);
    document.getElementById('lb-prev').addEventListener('click', () => open(current - 1));
    document.getElementById('lb-next').addEventListener('click', () => open(current + 1));

    lb.addEventListener('click', e => { if (e.target === lb) close(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') open(current - 1);
      if (e.key === 'ArrowRight') open(current + 1);
    });
  </script>
